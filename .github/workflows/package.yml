name: Package Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm_script: dist:linux
            artifact: query-petruz-linux
            paths: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            npm_script: dist:win
            artifact: query-petruz-windows
            paths: |
              release/*.exe
          - os: macos-latest
            npm_script: dist:mac
            artifact: query-petruz-macos
            paths: |
              release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test sidecar
        run: npm run test:sidecar

      - name: Package installer
        run: npm run ${{ matrix.npm_script }}

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
